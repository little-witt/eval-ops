[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aceval"
version = "0.2.1"
description = "Reference-runtime EvalOps for repairing, tuning, and evaluating Agent Skills."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "little-witt"}]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.4"]

[project.scripts]
aceval = "aceval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
